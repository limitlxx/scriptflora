<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title",    "label":"Title",    "type":"string","default":"Your title here"},
    {"id":"subtitle", "label":"Subtitle", "type":"string","default":""},
    {"id":"cta",      "label":"CTA text", "type":"string","default":"Learn more"},
    {"id":"logoUrl",  "label":"Logo URL", "type":"string","default":""},
    {"id":"primaryColor","label":"Brand colour","type":"string","default":"#6d28d9"}
  ]'
>
<head>
  <meta charset="utf-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0b; overflow: hidden; font-family: system-ui, sans-serif; }

    .scene {
      position: relative;
      width: 1920px; height: 1080px;
      background: #0a0a0b;
      overflow: hidden;
    }

    /* Video track — clips injected by the render route */
    .clip-container {
      position: absolute; inset: 0;
    }
    .clip-container video {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }

    /* Dark gradient overlay */
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.1) 0%,
        rgba(0,0,0,0.4) 60%,
        rgba(0,0,0,0.7) 100%
      );
    }

    /* Logo */
    .logo {
      position: absolute;
      top: 60px; left: 80px;
      max-height: 72px;
      max-width: 300px;
      object-fit: contain;
    }

    /* Title block */
    .title-block {
      position: absolute;
      bottom: 220px; left: 80px; right: 80px;
    }
    .title {
      font-size: 96px;
      font-weight: 700;
      line-height: 1.05;
      color: #fff;
      letter-spacing: -0.03em;
      text-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }
    .subtitle {
      margin-top: 24px;
      font-size: 40px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
      line-height: 1.3;
    }

    /* CTA */
    .cta {
      position: absolute;
      bottom: 80px; left: 80px;
      font-size: 32px;
      font-weight: 600;
      color: #fff;
      background: var(--brand, #6d28d9);
      padding: 20px 48px;
      border-radius: 8px;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
<div class="scene" id="main"
  data-composition-id="explainer"
  data-start="0"
  data-duration="10"
  data-width="1920"
  data-height="1080"
>
  <div class="clip-container" id="clips"></div>
  <div class="overlay"></div>
  <img class="logo" id="logo-el" src="" alt="Logo" style="display:none" />
  <div class="title-block">
    <div class="title" id="title-el">Loading…</div>
    <div class="subtitle" id="subtitle-el"></div>
  </div>
  <div class="cta" id="cta-el"></div>
</div>

<script>
  // HyperFrames variables — accessed via window.__hyperframes.getVariables()
  // Falls back to data-composition-variables defaults when not in a render context.
  const vars = window.__hyperframes?.getVariables?.() ?? {};

  document.documentElement.style.setProperty('--brand', vars.primaryColor || '#6d28d9');

  const titleEl    = document.getElementById('title-el');
  const subtitleEl = document.getElementById('subtitle-el');
  const ctaEl      = document.getElementById('cta-el');
  const logoEl     = document.getElementById('logo-el');

  titleEl.textContent    = vars.title    || '';
  subtitleEl.textContent = vars.subtitle || '';
  ctaEl.textContent      = vars.cta      || '';

  if (vars.logoUrl) {
    logoEl.src = vars.logoUrl;
    logoEl.style.display = 'block';
  }

  // Inject video clips — passed as _clips variable from the render route
  if (vars._clips) {
    const clips = JSON.parse(vars._clips);
    const container = document.getElementById('clips');
    clips.forEach((clip, i) => {
      if (!clip.videoUrl) return;
      const v = document.createElement('video');
      v.id = `clip-${i}`;
      v.src = clip.videoUrl;
      v.muted = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('data-start', clip.startTime || '0');
      v.setAttribute('data-duration', clip.duration || '5');
      v.setAttribute('data-track-index', String(i + 1));
      v.className = 'clip';
      container.appendChild(v);
    });
  }
</script>
</body>
</html>
