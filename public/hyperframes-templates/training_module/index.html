<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title",        "label":"Module title",   "type":"string","default":"Module 1"},
    {"id":"subtitle",     "label":"Section label",  "type":"string","default":"Introduction"},
    {"id":"keyFact",      "label":"Key fact / callout","type":"string","default":""},
    {"id":"presenter",    "label":"Presenter name", "type":"string","default":""},
    {"id":"logoUrl",      "label":"Organisation logo","type":"string","default":""},
    {"id":"primaryColor", "label":"Brand colour",   "type":"string","default":"#2563eb"}
  ]'
>
<head>
  <meta charset="utf-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f8fafc; overflow: hidden; font-family: system-ui, sans-serif; }
    .scene {
      position: relative;
      width: 1920px; height: 1080px;
      background: #f8fafc;
      overflow: hidden;
    }

    /* Header bar */
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 120px;
      background: var(--brand, #2563eb);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px;
    }
    .module-label {
      font-size: 32px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .logo { max-height: 72px; max-width: 240px; object-fit: contain; filter: brightness(10); }

    /* Video area */
    .clip-container {
      position: absolute;
      top: 120px; left: 0;
      width: 1200px;
      bottom: 0;
    }
    .clip-container video { width: 100%; height: 100%; object-fit: cover; }

    /* Side panel */
    .side-panel {
      position: absolute;
      top: 120px; right: 0;
      width: 720px;
      bottom: 0;
      background: #fff;
      border-left: 4px solid var(--brand, #2563eb);
      padding: 60px 56px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .section-label {
      font-size: 24px;
      font-weight: 600;
      color: var(--brand, #2563eb);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .side-title {
      font-size: 56px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .key-fact {
      margin-top: auto;
      background: var(--brand, #2563eb);
      color: #fff;
      border-radius: 12px;
      padding: 32px 40px;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.35;
    }
    .presenter {
      font-size: 24px;
      color: #64748b;
      font-style: italic;
    }
  </style>
</head>
<body>
<div class="scene" id="main"
  data-composition-id="training-module"
  data-start="0"
  data-duration="10"
  data-width="1920"
  data-height="1080"
>
  <div class="header">
    <div class="module-label" id="module-label-el">Module</div>
    <img class="logo" id="logo-el" src="" alt="Logo" style="display:none" />
  </div>

  <div class="clip-container" id="clips"></div>

  <div class="side-panel">
    <div class="section-label" id="subtitle-el">Section</div>
    <div class="side-title"   id="title-el">Loading…</div>
    <div class="key-fact"     id="keyfact-el" style="display:none"></div>
    <div class="presenter"    id="presenter-el"></div>
  </div>
</div>
<script>
  const vars = window.__hyperframes?.getVariables?.() ?? {};
  document.documentElement.style.setProperty('--brand', vars.primaryColor || '#2563eb');
  document.getElementById('module-label-el').textContent = vars.title     || '';
  document.getElementById('title-el').textContent        = vars.title     || '';
  document.getElementById('subtitle-el').textContent     = vars.subtitle  || '';
  document.getElementById('presenter-el').textContent    = vars.presenter || '';

  const keyFactEl = document.getElementById('keyfact-el');
  if (vars.keyFact) { keyFactEl.textContent = vars.keyFact; keyFactEl.style.display = 'block'; }

  const logoEl = document.getElementById('logo-el');
  if (vars.logoUrl) { logoEl.src = vars.logoUrl; logoEl.style.display = 'block'; }

  if (vars._clips) {
    const clips = JSON.parse(vars._clips);
    const container = document.getElementById('clips');
    clips.forEach((clip, i) => {
      if (!clip.videoUrl) return;
      const v = document.createElement('video');
      v.src = clip.videoUrl;
      v.muted = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('data-start', clip.startTime || '0');
      v.setAttribute('data-duration', clip.duration || '5');
      v.setAttribute('data-track-index', String(i + 1));
      v.className = 'clip';
      container.appendChild(v);
    });
  }
</script>
</body>
</html>
