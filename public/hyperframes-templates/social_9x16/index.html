<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"title",       "label":"Title",        "type":"string","default":"Hook line"},
    {"id":"cta",         "label":"CTA text",     "type":"string","default":"Follow for more"},
    {"id":"primaryColor","label":"Brand colour", "type":"string","default":"#6d28d9"}
  ]'
>
<head>
  <meta charset="utf-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0b; overflow: hidden; font-family: system-ui, sans-serif; }
    .scene {
      position: relative;
      width: 1080px; height: 1920px;
      background: #0a0a0b;
      overflow: hidden;
    }
    .clip-container {
      position: absolute; inset: 0;
    }
    .clip-container video {
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.85;
    }
    .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.8) 100%);
    }
    /* Safe-area bottom text */
    .title {
      position: absolute;
      bottom: 280px; left: 48px; right: 48px;
      font-size: 72px;
      font-weight: 800;
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 2px 16px rgba(0,0,0,0.7);
    }
    .cta {
      position: absolute;
      bottom: 120px; left: 48px;
      font-size: 36px;
      font-weight: 600;
      color: #fff;
      background: var(--brand, #6d28d9);
      padding: 18px 40px;
      border-radius: 48px;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
<div class="scene" id="main"
  data-composition-id="social-vertical"
  data-start="0"
  data-duration="15"
  data-width="1080"
  data-height="1920"
>
  <div class="clip-container" id="clips"></div>
  <div class="overlay"></div>
  <div class="title" id="title-el">Loading…</div>
  <div class="cta" id="cta-el"></div>
</div>
<script>
  const vars = window.__hyperframes?.getVariables?.() ?? {};
  document.documentElement.style.setProperty('--brand', vars.primaryColor || '#6d28d9');
  document.getElementById('title-el').textContent = vars.title || '';
  document.getElementById('cta-el').textContent   = vars.cta   || '';

  if (vars._clips) {
    const clips = JSON.parse(vars._clips);
    const container = document.getElementById('clips');
    clips.forEach((clip, i) => {
      if (!clip.videoUrl) return;
      const v = document.createElement('video');
      v.src = clip.videoUrl;
      v.muted = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('data-start', clip.startTime || '0');
      v.setAttribute('data-duration', clip.duration || '5');
      v.setAttribute('data-track-index', String(i + 1));
      v.className = 'clip';
      container.appendChild(v);
    });
  }
</script>
</body>
</html>
